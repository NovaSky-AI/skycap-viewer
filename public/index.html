<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>skycap viewer</title>
<style>
  :root {
    color-scheme: light;
    --bg: #fafaf8; --panel: #ffffff; --ink: #1c1c1a; --muted: #6a6a64; --line: #e3e2dd; --soft: #f1f0ec;
    --accent: #2d5bd0; --accent-soft: #e4ebfb; --model: #1d7a4b; --client: #7a5a1c;
    --bad: #b3261e; --bad-soft: #fbe5e3; --warn: #8a5a00; --warn-soft: #fbf0d9;
    --trained: #2f9e62; --sampled: #9ccfb3; --scaffold: #c9c7bf; --prompt: #9fb4e6;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #141413; --panel: #1b1b1a; --ink: #ebeae5; --muted: #9a9a93; --line: #33332f; --soft: #252522;
      --accent: #7ea2ff; --accent-soft: #1f2a44; --model: #5fce93; --client: #d8b36a;
      --bad: #ff8a80; --bad-soft: #3d1f1c; --warn: #f0c060; --warn-soft: #3a2f16;
      --trained: #3fb878; --sampled: #2c5e45; --scaffold: #4e4d47; --prompt: #3f5689;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #141413; --panel: #1b1b1a; --ink: #ebeae5; --muted: #9a9a93; --line: #33332f; --soft: #252522;
    --accent: #7ea2ff; --accent-soft: #1f2a44; --model: #5fce93; --client: #d8b36a;
    --bad: #ff8a80; --bad-soft: #3d1f1c; --warn: #f0c060; --warn-soft: #3a2f16;
    --trained: #3fb878; --sampled: #2c5e45; --scaffold: #4e4d47; --prompt: #3f5689;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, sans-serif; }
  .mono, .id, pre, code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  header { padding: 8px 16px; border-bottom: 1px solid var(--line); display: flex; gap: 14px; align-items: baseline; flex-wrap: wrap; background: var(--panel); }
  header h1 { font-size: 15px; margin: 0; }
  header .grow { flex: 1; }
  button, input, select { font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); }
  main { display: grid; grid-template-columns: minmax(280px, 360px) 1fr; height: calc(100vh - 41px); }
  aside { border-right: 1px solid var(--line); overflow: auto; background: var(--panel); display: flex; flex-direction: column; }
  .filters { position: sticky; top: 0; background: var(--panel); padding: 10px; border-bottom: 1px solid var(--line); display: grid; gap: 6px; z-index: 1; }
  .filters .line { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .filters input[type=search] { flex: 1; min-width: 0; }
  .filters label { font-size: 12px; display: inline-flex; gap: 4px; align-items: center; white-space: nowrap; }
  .row { padding: 7px 12px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .row:hover { background: var(--soft); }
  .row.active { background: var(--accent-soft); }
  .row .meta { font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .id { font-size: 12px; }
  .muted { color: var(--muted); }
  .badge { display: inline-block; font-size: 11px; line-height: 16px; padding: 0 6px; border-radius: 9px; border: 1px solid var(--line); white-space: nowrap; vertical-align: 1px; }
  .badge.failed, .badge.abandoned, .badge.bad { color: var(--bad); border-color: var(--bad); background: var(--bad-soft); }
  .badge.open, .badge.warn { color: var(--warn); border-color: var(--warn); background: var(--warn-soft); }
  .badge.fork { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
  .badge.good { color: var(--model); border-color: var(--model); }
  section#view { overflow: auto; padding: 14px 18px 60px; }
  .alerts { display: grid; gap: 4px; margin: 8px 0; }
  .alert { padding: 5px 10px; border-radius: 6px; font-size: 13px; border-left: 3px solid; }
  .alert.bad { background: var(--bad-soft); border-color: var(--bad); }
  .alert.warn { background: var(--warn-soft); border-color: var(--warn); }
  .alert.fork { background: var(--accent-soft); border-color: var(--accent); }
  .tabs { display: flex; gap: 4px; margin: 12px 0 10px; flex-wrap: wrap; }
  .tabs button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  pre { background: var(--soft); padding: 8px; border-radius: 6px; overflow: auto; font-size: 12px; white-space: pre-wrap; word-break: break-word; margin: 4px 0; max-height: 480px; }
  table { border-collapse: collapse; font-size: 12px; margin: 4px 0; }
  td, th { border-bottom: 1px solid var(--line); padding: 2px 8px; text-align: left; vertical-align: top; }
  td.mono { font-size: 11.5px; max-width: 360px; word-break: break-all; }
  details > summary { cursor: pointer; }
  .kv { font-size: 12px; }
  /* the fork tree */
  .tree { font-size: 12.5px; }
  .branch { margin-left: 10px; padding-left: 10px; border-left: 2px solid var(--line); }
  .branch.hidden { display: none; }
  .node { display: flex; gap: 6px; align-items: baseline; padding: 1px 4px; border-radius: 4px; cursor: pointer; white-space: nowrap; }
  .node:hover { background: var(--soft); }
  .node .who { font-family: ui-monospace, monospace; width: 1ch; }
  .node .who.model { color: var(--model); } .node .who.client { color: var(--client); }
  .node .role { font-weight: 600; min-width: 64px; }
  .node .preview { overflow: hidden; text-overflow: ellipsis; color: var(--muted); }
  .node.unbridged { background: var(--bad-soft); }
  .node.forkpt { background: var(--accent-soft); }
  .caret { width: 1.2em; display: inline-block; text-align: center; color: var(--accent); }
  .ndetail { margin: 2px 0 8px 26px; padding: 6px 10px; border-left: 2px solid var(--accent); background: var(--panel); }
  .bridged-false { color: var(--bad); font-weight: 600; }
  .bridged-absent { color: var(--muted); font-style: italic; }
  /* paths */
  .path { border: 1px solid var(--line); border-radius: 8px; margin: 10px 0; background: var(--panel); }
  .path > .head { padding: 6px 10px; border-bottom: 1px solid var(--line); display: flex; gap: 8px; flex-wrap: wrap; align-items: baseline; }
  .path > .body { padding: 4px 10px 8px; }
  .msg { border-left: 3px solid var(--line); padding: 2px 10px; margin: 6px 0; }
  .msg.model { border-color: var(--model); }
  .msg.target { background: color-mix(in srgb, var(--trained) 10%, transparent); }
  .msg.unbridged { border-color: var(--bad); }
  .msg .text { white-space: pre-wrap; word-break: break-word; max-height: 9.5em; overflow: hidden; cursor: pointer; font-size: 13px; }
  .msg .text.open { max-height: none; }
  /* tokens */
  .legend { display: flex; gap: 12px; font-size: 12px; flex-wrap: wrap; align-items: center; margin: 6px 0; }
  .sw { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -2px; margin-right: 4px; }
  .strip { display: flex; height: 14px; border-radius: 3px; overflow: hidden; margin: 8px 0 4px; background: var(--soft); }
  .strip span { display: block; height: 100%; cursor: pointer; min-width: 1px; }
  .toks { font-family: ui-monospace, monospace; font-size: 12px; white-space: pre-wrap; word-break: break-all; line-height: 1.6; }
  .toks .nlabel { display: inline-block; font-family: system-ui, sans-serif; font-size: 11px; padding: 0 5px; margin: 6px 4px 2px 0; border-radius: 4px; background: var(--soft); color: var(--muted); white-space: nowrap; }
  .toks .nlabel.unbridged { background: var(--bad-soft); color: var(--bad); }
  .toks span.t { border-radius: 2px; }
  .toks .t.alt { box-shadow: inset 0 -1px 0 color-mix(in srgb, var(--ink) 25%, transparent); }
  .toks .t.trained { background: color-mix(in srgb, var(--trained) 32%, transparent); }
  .toks .t.sampled { background: color-mix(in srgb, var(--sampled) 30%, transparent); }
  .toks .t.scaffold { color: var(--muted); background: color-mix(in srgb, var(--scaffold) 25%, transparent); }
  .toks .t.prompt { background: color-mix(in srgb, var(--prompt) 16%, transparent); }
  .toks .t.empty { display: inline-block; width: 3px; height: 1em; vertical-align: -2px; background: var(--warn); }
  .toks .t:hover { outline: 1px solid var(--accent); }
  #tip { position: fixed; pointer-events: none; z-index: 10; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; font: 12px ui-monospace, monospace; box-shadow: 0 2px 8px rgb(0 0 0 / .15); white-space: pre; display: none; }
  .empty-state { padding: 40px; text-align: center; }
  .more { margin: 10px; }
  @media (max-width: 760px) {
    main { grid-template-columns: 1fr; height: auto; }
    aside { max-height: 45vh; border-right: 0; border-bottom: 1px solid var(--line); }
    section#view { padding: 12px 16px 60px; }
  }
</style>
</head>
<body>
<header>
  <h1>skycap</h1>
  <span class="muted mono" id="dir"></span>
  <span class="muted" id="stats"></span>
  <span class="grow"></span>
  <button id="theme" title="theme: auto / light / dark">auto</button>
</header>
<main>
  <aside>
    <div class="filters">
      <div class="line">
        <input id="q" type="search" placeholder="filter: id, meta, annotations" aria-label="filter">
        <select id="status" aria-label="status">
          <option value="">any status</option><option>finished</option><option>failed</option><option>abandoned</option><option>open</option>
        </select>
      </div>
      <div class="line">
        <label title="calls whose prompt was re-rendered from messages instead of extending the previous tokens"><input type="checkbox" id="f-unbridged"> unbridged calls</label>
        <label><input type="checkbox" id="f-forked"> forked (paths &gt; 1)</label>
        <label title="records without the bridged field: a client re-tokenized copy of a model message, i.e. the prompt was re-rendered (inferred)"><input type="checkbox" id="f-signs"> re-render signs</label>
        <label title="a model turn opened <think> and never closed it"><input type="checkbox" id="f-think"> unclosed &lt;think&gt;</label>
        <label><input type="checkbox" id="f-failures"> failures</label>
        <label><input type="checkbox" id="f-nonempty"> non-empty</label>
      </div>
      <div class="line">
        <select id="sort" aria-label="sort">
          <option value="new">newest first</option><option value="old">oldest first</option>
          <option value="paths">most paths</option><option value="unbridged">most unbridged calls</option>
          <option value="tokens">most tokens</option><option value="reward">highest reward</option><option value="reward-asc">lowest reward</option>
        </select>
        <span class="muted kv" id="count"></span>
      </div>
    </div>
    <div id="list"></div>
  </aside>
  <section id="view"><div class="empty-state muted">Pick a trajectory.</div></section>
</main>
<div id="tip"></div>
<script>
'use strict';
const $ = (sel, root = document) => root.querySelector(sel);
const el = (tag, attrs = {}, ...kids) => {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === 'class') node.className = v;
    else if (k.startsWith('on')) node[k] = v;
    else node.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat(Infinity)) if (kid != null && kid !== false) node.append(kid instanceof Node ? kid : String(kid));
  return node;
};
const get = (path) => fetch(path).then(async (r) => (r.ok ? r.json() : Promise.reject(new Error(`${r.status} ${(await r.json().catch(() => ({}))).error ?? path}`))));
const when = (t) => (t ? new Date(t * 1000).toLocaleString() : '—');
const secs = (a, b) => (a != null && b != null ? `${(b - a).toFixed(2)}s` : '');
const plural = (n, word) => `${n} ${n === 1 ? word : word.endsWith('y') ? `${word.slice(0, -1)}ies` : `${word}s`}`;
const store = { get: (k) => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch { /* private mode */ } } };

/** A message as readable text: content (string or parts), reasoning, tool calls. */
function messageText(m) {
  if (!m) return '';
  const parts = [];
  if (m.reasoning_content) parts.push(`[reasoning] ${m.reasoning_content}`);
  if (typeof m.content === 'string') parts.push(m.content);
  else if (Array.isArray(m.content)) parts.push(m.content.map((p) => (typeof p === 'string' ? p : p.text ?? `[${p.type}]`)).join(''));
  else if (m.content != null) parts.push(JSON.stringify(m.content));
  for (const c of m.tool_calls ?? []) parts.push(`→ ${c.function?.name}(${c.function?.arguments ?? ''})`);
  if (m.tool_call_id) parts.unshift(`[${m.tool_call_id}]`);
  return parts.join('\n');
}
const bridgedOf = (c) => (Object.prototype.hasOwnProperty.call(c, 'bridged') ? c.bridged : 'absent');
const hasUnbridged = (n) => (n.calls ?? []).some((c) => c.bridged === false);
const sign = (n) => ({
  retokenized: data.summary.retokenized.includes(n.id),
  inferred: data.summary.bridged.absent > 0 && data.summary.inferred_unbridged.includes(n.id),
  unclosed: data.summary.unclosed_think.includes(n.id),
});
function signBadges(n) {
  const g = sign(n);
  return [
    g.retokenized ? el('span', { class: 'badge warn', title: `the same message as model node #${n.shadowed_by}, tokenized differently: the prompt was re-rendered from messages` }, `re-tokenized copy of #${n.shadowed_by}`) : null,
    g.inferred ? el('span', { class: 'badge bad', title: 'no bridged field in this record; the prompt runs through a re-tokenized copy, so this call was re-rendered' }, 'unbridged (inferred)') : null,
    g.unclosed ? el('span', { class: 'badge warn', title: 'opens <think> and never closes it' }, 'unclosed think') : null,
  ];
}

// -- theme ------------------------------------------------------------------------
const THEMES = ['auto', 'light', 'dark'];
function applyTheme(t) {
  if (t === 'auto') delete document.documentElement.dataset.theme;
  else document.documentElement.dataset.theme = t;
  $('#theme').textContent = t;
}
applyTheme(store.get('skycap-theme') ?? 'auto');
$('#theme').onclick = () => {
  const next = THEMES[(THEMES.indexOf($('#theme').textContent) + 1) % THEMES.length];
  store.set('skycap-theme', next);
  applyTheme(next);
};

// -- the list ---------------------------------------------------------------------
let all = [];
let current = null;
let shown = 300;

async function loadList() {
  const [list, stats] = await Promise.all([get('/api/trajectories'), get('/api/stats')]);
  all = list.data;
  for (const t of all) t._q = JSON.stringify([t.id, t.meta, t.annotations]).toLowerCase();
  $('#dir').textContent = list.dir;
  const s = stats.stats;
  $('#stats').textContent = [
    plural(s.trajectories, 'trajectory'),
    `${s.forked} forked`,
    `${s.bridged.false} unbridged calls in ${s.with_unbridged}`,
    s.with_bridged_absent ? `bridged unknown in ${s.with_bridged_absent}` : null,
    s.reward ? `reward mean ${s.reward.mean.toFixed(3)}` : null,
    list.errors.length ? `${list.errors.length} unreadable` : null,
  ].filter(Boolean).join(' · ');
  renderList();
  route();
}

function filtered() {
  const q = $('#q').value.trim().toLowerCase();
  const status = $('#status').value;
  const f = { unbridged: $('#f-unbridged').checked, forked: $('#f-forked').checked, failures: $('#f-failures').checked, signs: $('#f-signs').checked, think: $('#f-think').checked, nonempty: $('#f-nonempty').checked };
  const rows = all.filter((t) => (!status || t.status === status) && (!q || t._q.includes(q)) &&
    (!f.unbridged || t.bridged.false > 0) && (!f.forked || t.paths > 1) && (!f.failures || t.failures > 0) && (!f.signs || t.retokenized.length > 0) && (!f.think || t.unclosed_think.length > 0) && (!f.nonempty || t.nodes > 0));
  const reward = (t) => (typeof t.annotations?.reward === 'number' ? t.annotations.reward : -Infinity);
  const by = {
    new: (a, b) => (b.created_at ?? 0) - (a.created_at ?? 0),
    old: (a, b) => (a.created_at ?? 0) - (b.created_at ?? 0),
    paths: (a, b) => b.paths - a.paths,
    unbridged: (a, b) => b.bridged.false - a.bridged.false,
    tokens: (a, b) => (b.tokens ?? 0) - (a.tokens ?? 0),
    reward: (a, b) => reward(b) - reward(a),
    'reward-asc': (a, b) => reward(a) - reward(b),
  }[$('#sort').value];
  return rows.sort(by);
}

function metaLine(t) {
  const m = { ...t.meta };
  if (typeof m.task === 'string') m.task = m.task.split('/').pop();
  return Object.entries(m).map(([k, v]) => `${k}=${typeof v === 'object' ? JSON.stringify(v) : v}`).join(' ');
}

function row(t) {
  const reward = t.annotations?.reward;
  return el('div', { class: `row${t.id === current ? ' active' : ''}`, 'data-id': t.id, onclick: () => open(t.id) },
    el('div', {}, el('span', { class: 'id' }, t.id), ' ', el('span', { class: `badge ${t.status}` }, t.status),
      reward != null ? [' ', el('span', { class: `badge ${reward > 0 ? 'good' : ''}` }, `r=${reward}`)] : null,
      t.paths > 1 ? [' ', el('span', { class: 'badge fork' }, `${t.paths} paths`)] : null,
      t.bridged.false ? [' ', el('span', { class: 'badge bad', title: 'calls re-rendered from messages (bridged=false)' }, `${t.bridged.false} unbridged`)] : null,
      t.retokenized.length ? [' ', el('span', { class: 'badge warn', title: 're-tokenized copies of a model message: prompts were re-rendered (inferred)' }, `${t.retokenized.length} re-tokenized`)] : null,
      t.unclosed_think.length ? [' ', el('span', { class: 'badge warn', title: 'model turns with an unclosed <think>' }, 'unclosed think')] : null,
      t.failures ? [' ', el('span', { class: 'badge bad' }, `${t.failures} failed`)] : null),
    el('div', { class: 'muted meta' }, t.nodes ? `${t.nodes} nodes · ${plural(t.calls, 'call')}${t.tokens != null ? ` · ${t.tokens} tok` : ''}` : 'empty (no calls)',
      metaLine(t) ? ` · ${metaLine(t)}` : ''));
}

function renderList() {
  const rows = filtered();
  $('#count').textContent = `${rows.length} of ${all.length}`;
  const list = rows.slice(0, shown).map(row);
  if (rows.length > shown) list.push(el('button', { class: 'more', onclick: () => { shown += 500; renderList(); } }, `show ${Math.min(500, rows.length - shown)} more`));
  $('#list').replaceChildren(...(list.length ? list : [el('div', { class: 'empty-state muted' }, 'No trajectories match.')]));
}
for (const id of ['#q', '#status', '#sort', '#f-unbridged', '#f-forked', '#f-signs', '#f-think', '#f-failures', '#f-nonempty']) {
  $(id).addEventListener(id === '#q' ? 'input' : 'change', () => { shown = 300; renderList(); });
}
document.addEventListener('keydown', (e) => {
  if (e.target.matches('input, select, textarea') || !['j', 'k'].includes(e.key)) return;
  const rows = [...document.querySelectorAll('.row')];
  const i = rows.findIndex((r) => r.dataset.id === current);
  const next = rows[Math.max(0, Math.min(rows.length - 1, i + (e.key === 'j' ? 1 : -1)))];
  if (next) { open(next.dataset.id); next.scrollIntoView({ block: 'nearest' }); }
});

// -- one trajectory ----------------------------------------------------------------
const TABS = ['tree', 'paths', 'tokens', 'failures', 'document'];
let data = null;

function route() {
  const [id, tab] = decodeURIComponent(location.hash.slice(1)).split('/');
  if (id && id !== current) open(id, tab);
  else if (id && tab && data) show(tab);
}
window.addEventListener('hashchange', route);

async function open(id, tab = 'tree') {
  current = id;
  if (decodeURIComponent(location.hash.slice(1)).split('/')[0] !== id) history.replaceState(null, '', `#${encodeURIComponent(id)}`);
  document.querySelectorAll('.row').forEach((r) => r.classList.toggle('active', r.dataset.id === id));
  $('#view').replaceChildren(el('div', { class: 'muted' }, `Loading ${id}…`));
  try {
    data = await get(`/api/trajectories/${encodeURIComponent(id)}`);
  } catch (e) {
    $('#view').replaceChildren(el('div', { class: 'alert bad' }, String(e)));
    return;
  }
  if (current !== id) return;
  data.tokenCache = new Map();
  const doc = data.document;
  const s = data.summary;
  const unbridgedAt = s.unbridged_nodes;
  const alerts = [];
  if (s.bridged.false) alerts.push(el('div', { class: 'alert bad' }, `${plural(s.bridged.false, 'call')} re-rendered from messages instead of extending the previous tokens (bridged=false) at node${unbridgedAt.length > 1 ? 's' : ''} ${unbridgedAt.map((n) => `#${n}`).join(', ')}. The model saw a re-tokenized prompt there.`));
  if (s.bridged.absent) alerts.push(el('div', { class: 'alert warn' }, `${plural(s.bridged.absent, 'call')} ha${s.bridged.absent === 1 ? 's' : 've'} no bridged field (written before it existed): whether they extended the previous tokens is unknown.`));
  if (s.bridged.absent && s.inferred_unbridged.length) alerts.push(el('div', { class: 'alert bad' }, `Inferred: ${plural(s.inferred_unbridged.length, 'model call')} re-rendered (their prompt runs through a re-tokenized client copy of a model message) at ${s.inferred_unbridged.map((n) => `#${n}`).join(', ')}.`));
  if (s.retokenized.length) alerts.push(el('div', { class: 'alert warn' }, `${plural(s.retokenized.length, 'client node')} ${s.retokenized.length === 1 ? 'is a' : 'are'} re-tokenized cop${s.retokenized.length === 1 ? 'y' : 'ies'} of a model sibling (same message, different tokens): ${s.retokenized.map((n) => `#${n}`).join(', ')}. Each is a fork.`));
  if (s.unclosed_think.length) alerts.push(el('div', { class: 'alert warn' }, `Unclosed <think> in model turn${s.unclosed_think.length > 1 ? 's' : ''} ${s.unclosed_think.map((n) => `#${n}`).join(', ')}.`));
  if (s.paths > 1) alerts.push(el('div', { class: 'alert fork' }, `${s.paths} paths; forks at ${data.branch_points.map((n) => `#${n}`).join(', ') || 'separate roots'}.${s.shadowed ? ` ${s.shadowed} shadowed node(s).` : ''}`));
  if (s.failures) alerts.push(el('div', { class: 'alert bad' }, `${plural(s.failures, 'failed call')} (see failures).`));
  const shapes = Object.entries(data.sidecar_shapes).map(([kind, arrays]) =>
    el('span', { class: 'badge', title: Object.entries(arrays).map(([n, a]) => `${n}: ${a.dtype}[${a.shape.join(', ')}]`).join('\n') },
      `${kind} ${Object.values(arrays)[0]?.shape.join('×') ?? ''}`));
  const cap = doc.capture ?? {};
  const buttons = TABS.map((name) => el('button', { 'data-tab': name, onclick: () => { location.hash = `${id}/${name}`; } }, name));
  $('#view').replaceChildren(
    el('div', {}, el('span', { class: 'id' }, doc.id), ' ', el('span', { class: `badge ${doc.status}` }, doc.status), doc.ended === false ? [' ', el('span', { class: 'badge warn' }, 'not ended')] : null),
    el('div', { class: 'muted kv' }, `created ${when(doc.created_at)} · finished ${when(doc.finished_at)} · ${cap.mode ?? '?'} mode`,
      cap.tokenizer ? ` · ${cap.tokenizer}` : '', cap.engine ? ` · ${cap.engine}` : '', cap.logprobs_mode ? ` · ${cap.logprobs_mode}` : '',
      ` · ${s.nodes} nodes · ${plural(s.calls, 'call')}`, s.tokens != null ? ` · ${s.tokens} tokens` : '', ' ', shapes),
    el('div', { class: 'alerts' }, alerts),
    el('details', {}, el('summary', { class: 'muted kv' }, 'meta · annotations · capture · retries'),
      el('pre', {}, JSON.stringify({ meta: doc.meta, annotations: doc.annotations, capture: doc.capture, retries: doc.retries }, null, 1))),
    el('div', { class: 'tabs' }, buttons),
    el('div', { id: 'pane' }));
  show(TABS.includes(tab) ? tab : 'tree');
}

function show(name) {
  document.querySelectorAll('.tabs button').forEach((b) => b.classList.toggle('on', b.dataset.tab === name));
  $('#pane').replaceChildren(({ tree, paths, tokens, failures, document: rawDocument })[name]());
}

// -- tree ---------------------------------------------------------------------------
function callsTable(n) {
  if (!n.calls?.length) return null;
  return el('table', {},
    el('tr', {}, ['#', 'time', 'model', 'finish', 'bridged', 'usage', 'sampling', 'tools'].map((h) => el('th', {}, h))),
    n.calls.map((c, i) => {
      const b = bridgedOf(c);
      return el('tr', {}, el('td', {}, i + 1), el('td', {}, secs(c.t_start, c.t_end)), el('td', {}, c.model ?? ''), el('td', {}, c.finish_reason ?? ''),
        el('td', { class: b === false ? 'bridged-false' : b === 'absent' ? 'bridged-absent' : '', title: b === false ? 're-rendered from messages' : b === null ? 'first call, or text mode' : b === 'absent' ? 'record predates the field' : 'extended the previous tokens' }, String(b)),
        el('td', { class: 'mono' }, JSON.stringify(c.usage ?? {})), el('td', { class: 'mono' }, JSON.stringify(c.sampling ?? {})), el('td', { class: 'mono' }, c.tools ? c.tools.slice(0, 10) : ''));
    }));
}

function nodeDetail(n) {
  const t = n.tokens;
  return el('div', { class: 'ndetail' },
    el('div', { class: 'muted kv' }, `#${n.id} · parent ${n.parent ?? '—'} · depth ${n.depth} · ${n.author} · ${when(n.created_at)}`,
      t ? ` · ${t.length} tokens${t.sampled_start != null ? ` (scaffold ${t.sampled_start}, sampled ${t.length - t.sampled_start})` : ''}${t.has_logprobs ? '' : ' · no logprobs'}` : '',
      n.shadowed_by != null ? ` · shadowed by #${n.shadowed_by}` : ''),
    callsTable(n),
    el('pre', {}, JSON.stringify(n.message, null, 1)));
}

function tree() {
  const doc = data.document;
  if (!doc.nodes.length) return el('div', { class: 'muted' }, 'No nodes: this trajectory made no successful call.');
  const kids = new Map();
  for (const n of doc.nodes) (kids.get(n.parent) ?? kids.set(n.parent, []).get(n.parent)).push(n.id);
  const startsPath = new Map();
  const endsPath = new Map();
  data.paths.forEach((p, i) => {
    if (p.diverges_at != null) (startsPath.get(p.diverges_at) ?? startsPath.set(p.diverges_at, []).get(p.diverges_at)).push(i + 1);
    endsPath.set(p.leaf, i + 1);
  });
  const nodeRow = (n) => {
    const children = kids.get(n.id) ?? [];
    const fork = children.length > 1;
    const unb = hasUnbridged(n) || sign(n).inferred;
    const row = el('div', { class: `node${fork ? ' forkpt' : ''}${unb ? ' unbridged' : ''}`, id: `node-${n.id}` },
      el('span', { class: 'caret' }, fork ? '▾' : ''),
      el('span', { class: `who ${n.author}`, title: n.author }, n.author === 'model' ? '●' : '○'),
      el('span', { class: 'role' }, n.role ?? '?'),
      el('span', { class: 'muted mono' }, `#${n.id}`),
      n.calls.length > 1 ? el('span', { class: 'badge', title: 'identical outputs, one node' }, `×${n.calls.length}`) : null,
      fork ? el('span', { class: 'badge fork' }, `fork · ${children.length}`) : null,
      hasUnbridged(n) ? el('span', { class: 'badge bad', title: 'a call producing this node re-rendered its prompt from messages (bridged=false)' }, 'unbridged') : null,
      startsPath.has(n.id) ? el('span', { class: 'badge fork' }, `path ${startsPath.get(n.id).join(', ')} starts`) : null,
      endsPath.has(n.id) ? el('span', { class: 'badge' }, `leaf of path ${endsPath.get(n.id)}`) : null,
      signBadges(n),
      n.shadowed_by != null && !sign(n).retokenized ? el('span', { class: 'badge warn', title: 'a sibling with the same match hash, which history matching prefers' }, `shadowed by #${n.shadowed_by}`) : null,
      el('span', { class: 'preview' }, messageText(n.message).replace(/\s+/g, ' ').slice(0, 200)));
    let detail = null;
    row.onclick = (e) => {
      if (e.target.classList.contains('caret') && fork) {
        const hidden = row._branches[0].classList.toggle('hidden');
        row._branches.slice(1).forEach((b) => b.classList.toggle('hidden', hidden));
        e.target.textContent = hidden ? '▸' : '▾';
        return;
      }
      if (detail) { detail.remove(); detail = null; } else { detail = nodeDetail(n); row.after(detail); }
    };
    return row;
  };
  // A linear chain stays at one indent; each child of a fork gets its own branch.
  const render = (container, start) => {
    let id = start;
    for (;;) {
      const n = doc.nodes[id];
      const row = nodeRow(n);
      container.append(row);
      const children = kids.get(id) ?? [];
      if (children.length === 1) { id = children[0]; continue; }
      row._branches = children.map((child) => {
        const branch = el('div', { class: 'branch' });
        container.append(branch);
        render(branch, child);
        return branch;
      });
      return;
    }
  };
  const out = el('div', { class: 'tree' });
  const roots = kids.get(null) ?? [];
  for (const r of roots) {
    const box = roots.length > 1 ? el('div', { class: 'branch' }) : out;
    if (box !== out) out.append(box);
    render(box, r);
  }
  return el('div', {}, el('div', { class: 'legend muted' }, '● model  ○ client · click a node for its message and calls · ▾ collapses a fork'), out);
}

const s0 = (ids) => (ids.some((id) => !hasUnbridged(data.document.nodes[id])) ? ' (incl. inferred)' : '');
// -- paths --------------------------------------------------------------------------
function paths() {
  const doc = data.document;
  if (!data.paths.length) return el('div', { class: 'muted' }, 'No paths.');
  const trainedIn = new Map();
  data.paths.forEach((p, i) => p.targets.forEach((id) => trainedIn.set(id, i + 1)));
  const msg = (id, p) => {
    const n = doc.nodes[id];
    const target = p.targets.includes(id);
    const text = el('div', { class: 'text', title: 'click to expand', onclick: (e) => e.currentTarget.classList.toggle('open') }, messageText(n.message));
    return el('div', { class: `msg${n.author === 'model' ? ' model' : ''}${target ? ' target' : ''}${hasUnbridged(n) ? ' unbridged' : ''}` },
      el('div', { class: 'muted kv' }, `#${id} ${n.role ?? '?'} · ${n.author}`,
        n.author === 'model' ? (target ? ' · trained here' : ` · trained in path ${trainedIn.get(id)}`) : '',
        n.tokens ? ` · ${n.tokens.length} tok` : '', ' ',
        hasUnbridged(n) ? el('span', { class: 'badge bad' }, 'unbridged') : null, signBadges(n),
        n.shadowed_by != null && !sign(n).retokenized ? el('span', { class: 'badge warn' }, `shadowed by #${n.shadowed_by}`) : null),
      text);
  };
  return el('div', {}, data.paths.map((p, i) => {
    const shared = p.path.slice(0, p.shared);
    const fresh = p.path.slice(p.shared);
    const tok = p.path.every((id) => doc.nodes[id].tokens) ? p.path.reduce((s, id) => s + doc.nodes[id].tokens.length, 0) : null;
    const trainedTok = p.targets.reduce((s, id) => { const t = doc.nodes[id].tokens; return s + (t && t.sampled_start != null ? t.length - t.sampled_start : 0); }, 0);
    const unb = p.path.filter((id) => hasUnbridged(doc.nodes[id]) || sign(doc.nodes[id]).inferred);
    return el('div', { class: 'path' },
      el('div', { class: 'head' }, el('strong', {}, `path ${i + 1}`), el('span', { class: 'muted' }, `→ leaf #${p.leaf} · ${p.path.length} nodes · trains ${plural(p.targets.length, 'node')}`),
        tok != null ? el('span', { class: 'muted' }, `· ${tok} tokens, ${trainedTok} trained`) : null,
        p.fork_from != null ? el('span', { class: 'badge fork' }, `forks from #${p.fork_from} at #${p.diverges_at}`) : i > 0 ? el('span', { class: 'badge fork' }, 'new root') : null,
        unb.length ? el('span', { class: 'badge bad' }, `unbridged${s0(unb)} at ${unb.map((n) => `#${n}`).join(', ')}`) : null,
        tok != null ? el('button', { onclick: () => { tokenPath = i; location.hash = `${doc.id}/tokens`; } }, 'tokens') : null),
      el('div', { class: 'body' },
        shared.length ? el('details', {}, el('summary', { class: 'muted kv' }, `${plural(shared.length, 'node')} shared with earlier paths (#${shared[0]} … #${shared.at(-1)})`), shared.map((id) => msg(id, p))) : null,
        fresh.map((id) => msg(id, p))));
  }));
}

// -- tokens -------------------------------------------------------------------------
let tokenPath = 0;
const KINDS = { trained: 'trained on this path', sampled: 'sampled, trained on another path', scaffold: 'template scaffold of a model turn', prompt: 'client (prompt) tokens' };

function tokens() {
  const doc = data.document;
  if (!doc.sidecars?.tokens) return el('div', { class: 'muted' }, doc.nodes.length ? 'Text mode: no tokens were captured.' : 'No nodes.');
  if (tokenPath >= data.paths.length) tokenPath = 0;
  const select = el('select', { 'aria-label': 'path' }, data.paths.map((p, i) => el('option', { value: i, selected: i === tokenPath }, `path ${i + 1} → leaf #${p.leaf}${p.fork_from != null ? ` (forks from #${p.fork_from})` : ''}`)));
  const colour = el('select', { 'aria-label': 'colour' }, el('option', { value: 'kind' }, 'colour: kind'), el('option', { value: 'logprob' }, 'colour: logprob'));
  const body = el('div', {}, el('div', { class: 'muted' }, 'Loading tokens…'));
  const load = () => {
    tokenPath = Number(select.value);
    const i = tokenPath;
    body.replaceChildren(el('div', { class: 'muted' }, 'Loading tokens…'));
    const cached = data.tokenCache.get(i);
    (cached ? Promise.resolve(cached) : get(`/api/trajectories/${encodeURIComponent(doc.id)}/tokens?path=${i}`))
      .then((r) => { data.tokenCache.set(i, r); if (tokenPath === i) body.replaceChildren(renderTokens(r.path, colour.value)); })
      .catch((e) => body.replaceChildren(el('div', { class: 'alert bad' }, String(e))));
  };
  select.onchange = load;
  colour.onchange = load;
  load();
  return el('div', {},
    el('div', { class: 'legend' }, select, colour,
      Object.entries(KINDS).map(([k, label]) => el('span', {}, el('span', { class: 'sw', style: `background:var(--${k})` }), `${k}`, el('span', { class: 'muted' }, ` ${label}`))),
      el('span', {}, el('span', { class: 'sw', style: 'background:var(--warn)' }), 'empty span (part of a multi-token character)')),
    body);
}

function lpColour(lp) {
  if (lp == null) return 'transparent';
  const p = Math.exp(lp); // 1 = certain; low probability shades towards red
  return `color-mix(in srgb, var(--bad) ${Math.round((1 - p) * 70)}%, color-mix(in srgb, var(--trained) 25%, transparent))`;
}

function renderTokens(p, colour) {
  const doc = data.document;
  const total = p.nodes.reduce((s, n) => s + (n.token_ids?.length ?? 0), 0);
  const strip = el('div', { class: 'strip' });
  const toks = el('div', { class: 'toks' });
  const tip = $('#tip');
  toks.onmousemove = (e) => {
    const t = e.target;
    if (!t.classList?.contains('t')) { tip.style.display = 'none'; return; }
    const n = p.nodes[Number(t.dataset.n)];
    const k = Number(t.dataset.k);
    const lp = n.logprobs?.[k];
    tip.textContent = `node #${n.node} ${n.role ?? ''} · pos ${k}/${n.token_ids.length}\nid ${n.token_ids[k]} · ${n.kinds[k]}\nlogprob ${lp == null ? (n.logprobs ? 'NaN (unknown)' : 'not recorded') : `${lp.toFixed(4)}  (p=${Math.exp(lp).toFixed(3)})`}\ntext ${JSON.stringify(n.pieces ? n.pieces[k] : null)}`;
    tip.style.display = 'block';
    tip.style.left = `${Math.min(e.clientX + 12, innerWidth - tip.offsetWidth - 8)}px`;
    tip.style.top = `${Math.min(e.clientY + 14, innerHeight - tip.offsetHeight - 8)}px`;
  };
  toks.onmouseleave = () => { tip.style.display = 'none'; };
  p.nodes.forEach((n, ni) => {
    const node = doc.nodes[n.node];
    const g = sign(node);
    const label = el('span', { class: `nlabel${hasUnbridged(node) || g.inferred ? ' unbridged' : ''}`, id: `tok-node-${n.node}` },
      `#${n.node} ${n.role ?? '?'} · ${n.author}${n.target ? ' · trained here' : ''}${hasUnbridged(node) ? ' · unbridged: prompt re-rendered' : g.inferred ? ' · unbridged (inferred)' : ''}${g.retokenized ? ` · re-tokenized copy of #${node.shadowed_by}` : ''}${n.missing ? ' · no tokens' : ` · ${n.token_ids.length} tok`}`);
    toks.append(ni ? '\n' : '', label, '\n');
    if (n.missing) return;
    // strip: contiguous runs of one kind
    let runStart = 0;
    for (let k = 1; k <= n.kinds.length; k++) {
      if (k === n.kinds.length || n.kinds[k] !== n.kinds[runStart]) {
        const kind = n.kinds[runStart];
        strip.append(el('span', { style: `width:${(100 * (k - runStart)) / total}%;background:var(--${kind})`, title: `#${n.node} ${n.role ?? ''}: ${k - runStart} ${kind} tokens`, onclick: () => label.scrollIntoView({ block: 'center' }) }));
        runStart = k;
      }
    }
    const frag = document.createDocumentFragment();
    for (let k = 0; k < n.token_ids.length; k++) {
      const piece = n.pieces ? n.pieces[k] : `⟨${n.token_ids[k]}⟩`;
      const span = document.createElement('span');
      span.className = `t ${n.kinds[k]}${k % 2 ? ' alt' : ''}${piece === '' ? ' empty' : ''}`;
      span.dataset.n = ni;
      span.dataset.k = k;
      if (colour === 'logprob' && n.kinds[k] !== 'prompt' && n.kinds[k] !== 'scaffold') span.style.background = lpColour(n.logprobs?.[k]);
      span.textContent = piece;
      frag.append(span);
    }
    toks.append(frag);
  });
  const c = p.counts;
  return el('div', {},
    el('div', { class: 'muted kv' }, `${total} tokens: ${c.trained} trained · ${c.sampled} sampled elsewhere · ${c.scaffold} scaffold · ${c.prompt} prompt`,
      p.nodes.some((n) => n.pieces == null && !n.missing) ? ' · some nodes recorded no text (ids shown)' : ''),
    strip, toks);
}

// -- failures, document ---------------------------------------------------------------
function failures() {
  const f = data.document.failures ?? [];
  if (!f.length) return el('div', { class: 'muted' }, 'No failed calls.');
  return el('table', {}, el('tr', {}, ['when', 'status', 'input leaf', 'error'].map((h) => el('th', {}, h))),
    f.map((x) => el('tr', {}, el('td', {}, when(x.t)), el('td', {}, x.status ?? '—'), el('td', {}, x.input_leaf != null ? `#${x.input_leaf}` : '—'), el('td', { class: 'mono' }, x.error))));
}

function rawDocument() {
  const doc = data.document;
  return el('div', {},
    el('div', { class: 'muted kv' }, 'The document as stored (nodes collapsed below).'),
    el('pre', {}, JSON.stringify({ ...doc, nodes: `[${doc.nodes.length} nodes]` }, null, 1)),
    el('details', {}, el('summary', { class: 'muted kv' }, 'nodes'), el('pre', {}, JSON.stringify(doc.nodes, null, 1))));
}

loadList().catch((e) => $('#list').replaceChildren(el('div', { class: 'empty-state muted' }, String(e))));
</script>
</body>
</html>
